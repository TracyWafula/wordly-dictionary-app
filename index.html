<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary App</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
     
    <section class="sectionone">
       <h1 id="app-name"> Wordly Dictionary Application  </h1>
            <p> View phonetics, definitions and synonyms.<p>

            <form id="word-search-form">
                <label for="searched-word"> </label>
                <input id="searched-word"  placeholder="Enter a word"  type="text" required>
                <button type="submit">Search</button>
                <p class="errorhandling" id="errorPopUp"></p>
            </form>

    
    
    <div id="apiResults" > 
        <p id="showDefinition"></p>
        <p id="showPhonetic"></p>
        <button id="playAudioButton"> Play Word Audio </button>
        <audio id="playAudio"></audio>
   
        <div id="showDefinitionb"></div>
        
    </div>
     
    </section>

    <div id="showSynonyms"> </div>
    
    
    

    <script src="script.js"></script>
</body>
</html>
