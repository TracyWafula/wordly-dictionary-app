<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary App</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <h1> TED | THE ENGLISH DICTIONARY </h1>

    <form id="word-search-form">
        <label for="searched-word">Search for the Word: </label>
        <input type="text" id="searched-word" name="searched-word" placeholder="Search Dictionary" >
        <button type="submit">Search</button>
        <p class="errorhandling" id="errorPopUp"></p>
    </form>

    <h1>Definition</h1>
    <div id="definition"></div>
    
    <script src="script.js"></script>
</body>
</html>
